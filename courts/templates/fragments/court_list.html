<!-- 場館列表行片段 -->
{% for c in courts %}
<tr class="court-row"
    hx-get="{% url 'court_details' c.id %}"
    hx-target="#court-detail-modal"
    data-bs-toggle="modal"
    data-bs-target="#courtModal"
    style="cursor: pointer;">
  <td><strong>{{ c.id }}</strong></td>
  <td>
    <span class="court-link">{{ c.courtname }}</span>
  </td>
  <td>{{ c.city }}</td>
  <td>
    <span class="badge bg-success" style="background-color: var(--green-mid) !important;">{{ c.get_courttype_display }}</span>
  </td>
  <td>
    {% if c.photo %}
      <div class="court-table-img-wrapper">
        <img src="{{ c.photo.url }}" alt="{{ c.courtname }}" class="court-table-img">
      </div>
    {% else %}
      <span class="text-muted small">無照片</span>
    {% endif %}
  </td>
</tr>
{% empty %}
<tr>
  <td colspan="5" class="text-center text-muted">沒有找到符合條件的場館。</td>
</tr>
{% endfor %}
