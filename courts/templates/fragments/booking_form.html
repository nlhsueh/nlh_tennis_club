<!-- 預訂表單片段 -->
{% if error_message %}
  <div class="alert alert-error" style="margin-bottom: 14px; font-size: 13px; padding: 10px 14px;">
    ⚠️ {{ error_message }}
  </div>
{% endif %}

<form class="form-card" 
      hx-post="{% url 'create_booking' %}"
      hx-target="#booking-form-container"
      style="max-width: 100%; border: none; padding: 0; background: transparent; display: flex; flex-direction: column; gap: 14px;">
  {% csrf_token %}
  
  <input type="hidden" name="court_id" value="{{ court.id }}">
  
  <div class="form-field">
    <label for="booking_date">預訂日期</label>
    <input type="date" id="booking_date" name="booking_date" 
           value="{{ today_date }}"
           hx-post="{% url 'check_availability' %}"
           hx-target="#availability-status"
           hx-include="[name='court_id']"
           required>
    <div id="availability-status" style="margin-top: 8px; font-size: 13px; font-weight: 500;"></div>
  </div>

  <div class="form-field">
    <label for="reason">預訂原因</label>
    <textarea id="reason" name="reason" placeholder="請輸入預訂原因..." rows="3" style="width: 100%; padding: 12px 14px; font-family: inherit; font-size: 14px; line-height: 1.6; background: var(--surface); color: var(--text); border: 1.5px solid var(--border); border-radius: 8px; outline: none; resize: vertical; transition: border-color 0.18s, box-shadow 0.18s;">{{ reason }}</textarea>
  </div>
  
  <div style="display: flex; gap: 8px; margin-top: 10px;">
    <button type="submit" class="btn btn-primary">確認預訂</button>
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
  </div>
</form>

<div id="booking-result" style="margin-top: 12px;"></div>
