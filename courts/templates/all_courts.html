{% extends "master.html" %}

{% block title %}My Tennis Club - 球場列表{% endblock %}

{% block content %}

<h1 class="page-title">所有球場</h1>

<div class="mb-4 d-flex gap-3 justify-content-center" style="max-width: 500px; margin: 0 auto 24px;">
  <select name="court-type" class="form-select"
          hx-get="{% url 'courts' %}"
          hx-target="#court-list-body"
          hx-include="[name='city']"
          style="padding: 10px 15px; border-radius: 99px; border: 1.5px solid var(--border); font-family: inherit; font-size: 14px; outline: none; width: 50%;">
    <option value="">全部類型</option>
    <option value="G">草地 (G)</option>
    <option value="H">硬地 (H)</option>
  </select>

  <select name="city" class="form-select"
          hx-get="{% url 'courts' %}"
          hx-target="#court-list-body"
          hx-include="[name='court-type']"
          style="padding: 10px 15px; border-radius: 99px; border: 1.5px solid var(--border); font-family: inherit; font-size: 14px; outline: none; width: 50%;">
    <option value="">全部城市</option>
    <option value="Taipei">台北</option>
    <option value="Taichung">台中</option>
    <option value="Kaohsiung">高雄</option>
    <option value="Tainan">台南</option>
  </select>
</div>

<div class="table-responsive">
  <table class="table table-striped table-bordered align-middle">
    <thead class="table-dark">
      <tr>
        <th scope="col" style="width: 8%;">ID</th>
        <th scope="col" style="width: 25%;">球場</th>
        <th scope="col" style="width: 20%;">所在城市</th>
        <th scope="col" style="width: 22%;">型態</th>
        <th scope="col" style="width: 25%;">照片</th>
      </tr>
    </thead>
    <tbody id="court-list-body">
      {% include "fragments/court_list.html" %}
    </tbody>
  </table>
</div>

<!-- Modal for Court Details -->
<div class="modal fade" id="courtModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content" id="court-detail-modal" style="border-radius: 16px; overflow: hidden; border: 1px solid var(--border); background: var(--surface);">
      <!-- Content loaded via HTMX will appear here -->
    </div>
  </div>
</div>

<!-- JavaScript to show modal -->
<script>
  function showModal() {
    var myModal = new bootstrap.Modal(document.getElementById('courtModal'));
    myModal.show();
  }
</script>

<style>
  .table-responsive {
    margin-bottom: 24px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface);
  }
  .table {
    margin-bottom: 0;
  }
  .court-link {
    color: var(--green-dark);
    font-weight: 600;
    text-decoration: none;
    transition: color 0.15s ease-in-out;
  }
  .court-link:hover {
    color: var(--clay);
  }
  .court-table-img-wrapper {
    width: 80px;
    height: 50px;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .court-table-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>

{% endblock %}
