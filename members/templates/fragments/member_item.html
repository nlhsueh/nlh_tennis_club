<!-- 單個成員項目片段 -->
<li class="list-group-item d-flex justify-content-between align-items-center bg-transparent border-0 px-0 py-2"
    id="member-{{ x.id }}"
    hx-get="{% url 'member_detail' x.id %}"
    hx-target="#modal-content"
    data-bs-toggle="modal"
    data-bs-target="#memberModal"
    style="cursor: pointer; transition: background-color 0.2s;">
  <div>
    <span class="fw-semibold" style="color: var(--green-dark);">
      {{ x.lastname }}{{ x.firstname }}
    </span>
    {% if x.user %}
      <span class="text-muted small ms-2">({{ x.user }})</span>
    {% endif %}
  </div>
  <span class="badge rounded-pill bg-success" style="background-color: var(--green-mid) !important; font-size: 11px;">{{ x.age }} 歲</span>
</li>
