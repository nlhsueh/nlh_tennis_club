{% extends "master.html" %}

{% block title %}My Tennis Club - 成員列表{% endblock %}

{% block content %}

<h1 class="page-title">俱樂部成員</h1>

<div class="mb-4" style="max-width: 400px; margin: 0 auto 24px;">
  <input type="text" 
         class="form-control" 
         name="search" 
         placeholder="搜尋成員..."
         hx-get="{% url 'members' %}"
         hx-target="#member-list"
         hx-trigger="input changed delay:300ms, search"
         style="padding: 10px 18px; border-radius: 99px; border: 1.5px solid var(--border); font-family: inherit; font-size: 14px; outline: none; width: 100%;">
</div>

<div id="member-list">
  {% include "fragments/member_list.html" %}
</div>

<!-- Modal for Member Details -->
<div class="modal fade" id="memberModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content" id="modal-content" style="border-radius: 16px; overflow: hidden; border: 1px solid var(--border); background: var(--surface);">
      <!-- Content loaded via HTMX will appear here -->
    </div>
  </div>
</div>

<!-- JavaScript to show modal -->
<script>
  function showModal() {
    var myModal = new bootstrap.Modal(document.getElementById('memberModal'));
    myModal.show();
  }
</script>

{% endblock %}
